[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Remappings for cleaner imports
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# Test configuration
verbosity = 3
gas_reports = ["*"]
fuzz = { runs = 256 }
invariant = { runs = 10, depth = 15 }

# RPC endpoints for testing
[rpc_endpoints]
anvil = "http://localhost:8545"
